name: Build APK

# Builds a downloadable debug APK on GitHub's runners (which have the Android SDK
# preinstalled and full network access). This also serves as the first real compile
# of the :app module. Triggered on push to the working branch and manually.
on:
  workflow_dispatch:
  push:
    branches: [ claude/app-docs-review-uctnfo ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Regenerate a valid Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      - name: Run core unit tests
        run: gradle :core:test --stacktrace --no-daemon

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meditation-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload regenerated wrapper jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-jar
          path: gradle/wrapper/gradle-wrapper.jar
          if-no-files-found: warn
