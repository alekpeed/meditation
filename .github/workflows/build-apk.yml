name: Build APK

# Builds a downloadable debug APK on GitHub's runners (Android SDK preinstalled,
# full network access) since the sandbox cannot reach dl.google.com. This is also
# the first real compile of the :app module. Triggered on push and manually.
on:
  workflow_dispatch:
  push:
    branches: [ claude/app-docs-review-uctnfo ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner ships Gradle 9.x (too new for AGP 8.7.3). Use it only to write a
      # valid wrapper pinned to 8.11.1, then build through that wrapper. This also
      # replaces the placeholder wrapper jar with a checksum-valid one.
      - name: Bootstrap Gradle 8.11.1 wrapper
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      - name: Core unit tests
        run: ./gradlew :core:test --stacktrace --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meditation-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
